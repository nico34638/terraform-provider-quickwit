# Known vulnerabilities in the code paths the provider actually calls
# (dependencies and Go standard library). Also runs weekly: new advisories show
# up without any change to the repository. govulncheck is pinned in go.mod as a
# Go tool, so Dependabot keeps it up to date.
name: govulncheck

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go tool govulncheck ./...
