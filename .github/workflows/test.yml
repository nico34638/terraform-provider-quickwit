name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  commits:
    name: Conventional commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check commit subjects
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # New branch or force-push: nothing reliable to compare against.
          if [[ -z $BASE || $BASE == 0000000000000000000000000000000000000000 ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "no base commit, skipping"; exit 0
          fi
          .githooks/check-commit-msg.sh "$BASE..$HEAD"

  unit:
    name: Build, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff
      - run: go build ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - run: go test ./...

  docs:
    name: Generated docs are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: go generate ./...
      - name: Check for changes
        run: |
          git diff --exit-code -- docs || {
            echo "::error::docs/ is out of date: run 'go generate ./...' and commit the result"
            exit 1
          }

  acceptance:
    name: Acceptance (${{ matrix.cli }})
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        cli: [terraform, tofu]
    env:
      TF_ACC: "1"
      TF_ACC_PROVIDER_NAMESPACE: nico34638
      QUICKWIT_ENDPOINT: http://localhost:7280
      QUICKWIT_TEST_SOURCES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - if: matrix.cli == 'terraform'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - if: matrix.cli == 'tofu'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_wrapper: false
      - name: Select the CLI used by the tests
        run: echo "TF_ACC_TERRAFORM_PATH=$(command -v ${{ matrix.cli }})" >> "$GITHUB_ENV"
      - name: Start Quickwit, Kafka and LocalStack
        run: docker compose --profile sources up -d --wait
      - run: go test ./... -count=1 -timeout 15m
      - name: End-to-end test
        env:
          TF_BIN: ${{ matrix.cli }}
          E2E_KAFKA_BOOTSTRAP: kafka:29092
          E2E_KAFKA_TOPIC: tf-acc-1
          E2E_SQS_QUEUE_URL: http://localstack:4566/000000000000/tf-acc
          E2E_KINESIS_STREAM: tf-acc
          E2E_KINESIS_ENDPOINT: http://localstack:4566
        run: e2e/run.sh
      - name: Quickwit logs
        if: failure()
        run: docker compose logs quickwit
