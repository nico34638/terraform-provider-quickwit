# Publishes a release when a `v*` tag is pushed. The Terraform and OpenTofu
# registries pick up GitHub releases signed with the GPG key registered for
# the namespace.
#
# Secrets: GPG_PRIVATE_KEY (ASCII-armored private key), PASSPHRASE.
#
# Supply chain: actions are pinned by commit SHA (Dependabot updates the SHA
# and the version comment), goreleaser by exact version, the Go module cache
# is not restored (a poisoned cache would end up in signed binaries), and the
# checkout does not keep the token in .git/config.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff
      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0 # goreleaser itself, bumped by hand
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
